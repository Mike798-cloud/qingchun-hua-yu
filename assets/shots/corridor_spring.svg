<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
 <linearGradient id="grade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d89b" stop-opacity=".16"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#526c76" stop-opacity=".26"/></linearGradient>
 <radialGradient id="vign"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#211b18" stop-opacity=".34"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="tiny"><feGaussianBlur stdDeviation="2.5"/></filter>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="13"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
 <style>
.sunbeam{animation:beam 7s ease-in-out infinite alternate}.leaves{animation:sway 5s ease-in-out infinite alternate}.walkers{animation:step 4s ease-in-out infinite}@keyframes beam{to{transform:translateX(28px);opacity:.18}}@keyframes sway{to{transform:translateX(8px) rotate(.3deg)}}@keyframes step{50%{transform:translateY(-3px)}}</style>
</defs>
<rect width="1600" height="900" fill="#d8cfbc"/>
<image href="data:image/svg+xml;base64," x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>

<g opacity=".72" class="leaves"><path d="M0 0h520q-120 100-245 130T0 190z" fill="#74866e"/><path d="M1600 0h-470q100 95 225 128t245 78z" fill="#657a68"/></g>
<g class="sunbeam" opacity=".28"><path d="M1050 -40 L1510 900 H1230 L880 -20Z" fill="#fff2c8"/></g>
<g opacity=".75" class="walkers"><path d="M280 668 q20-75 52-75t50 75l-10 150h-80z" fill="#33434b"/><circle cx="332" cy="574" r="29" fill="#c9997d"/><path d="M302 567q15-48 61-15l8 35q-36-25-69-20" fill="#302926"/></g>
<g opacity=".42" filter="url(#tiny)"><ellipse cx="1470" cy="735" rx="150" ry="36" fill="#f7d693"/><ellipse cx="151" cy="725" rx="120" ry="30" fill="#f3cf89"/></g>
<rect width="1600" height="900" fill="url(#grade)" pointer-events="none"/>
<rect width="1600" height="900" fill="url(#vign)" pointer-events="none"/>
<rect width="1600" height="900" fill="#fff" filter="url(#paper)" opacity=".32" pointer-events="none"/>
</svg>