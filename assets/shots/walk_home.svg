<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
 <linearGradient id="grade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a66e" stop-opacity=".16"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#4f6075" stop-opacity=".26"/></linearGradient>
 <radialGradient id="vign"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#211b18" stop-opacity=".34"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="tiny"><feGaussianBlur stdDeviation="2.5"/></filter>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="13"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
 <style>.pair{animation:walk 3.6s ease-in-out infinite}.bokeh{animation:bokeh 7s ease-in-out infinite alternate}@keyframes walk{50%{transform:translate(560px,395px)}}@keyframes bokeh{to{transform:translateX(25px);opacity:.25}}</style>
</defs>
<rect width="1600" height="900" fill="#d8cfbc"/>
<image href="data:image/svg+xml;base64," x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>

<g class="sky" opacity=".25"><rect x="0" y="0" width="1600" height="900" fill="#f1b06e"/></g>
<g transform="translate(560 400)" opacity=".9" class="pair"><ellipse cx="65" cy="350" rx="55" ry="18" fill="#272824" opacity=".15"/><path d="M20 170q42-105 95 0l24 210H0z" fill="#d7e0df" stroke="#403a36" stroke-width="6"/><circle cx="67" cy="120" r="45" fill="#d0a080"/><path d="M25 115q13-72 77-34l8 48q-50-34-85-14" fill="#39302c"/>
<ellipse cx="320" cy="350" rx="55" ry="18" fill="#272824" opacity=".15"/><path d="M275 170q42-105 95 0l24 210H255z" fill="#d7e0df" stroke="#403a36" stroke-width="6"/><circle cx="322" cy="120" r="45" fill="#d0a080"/><path d="M280 115q13-72 77-34l8 48q-50-34-85-14" fill="#45362f"/>
<path d="M115 205q75 38 160 0" fill="none" stroke="#d0a080" stroke-width="22" stroke-linecap="round" opacity=".72"/></g>
<g class="bokeh" fill="#ffe1a1" opacity=".42" filter="url(#soft)"><circle cx="205" cy="190" r="42"/><circle cx="1380" cy="240" r="55"/><circle cx="1260" cy="620" r="30"/></g>
<rect width="1600" height="900" fill="url(#grade)" pointer-events="none"/>
<rect width="1600" height="900" fill="url(#vign)" pointer-events="none"/>
<rect width="1600" height="900" fill="#fff" filter="url(#paper)" opacity=".32" pointer-events="none"/>
</svg>