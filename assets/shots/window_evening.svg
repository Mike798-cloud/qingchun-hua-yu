<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
 <linearGradient id="grade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4bf77" stop-opacity=".16"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#52636d" stop-opacity=".26"/></linearGradient>
 <radialGradient id="vign"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#211b18" stop-opacity=".34"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="tiny"><feGaussianBlur stdDeviation="2.5"/></filter>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="13"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
 <style>.curtain{transform-origin:1450px 40px;animation:curtain 4.6s ease-in-out infinite alternate}.dust{animation:dust 6s linear infinite alternate}.light{animation:light 7s ease-in-out infinite alternate}.girl{animation:breathe 4s ease-in-out infinite}@keyframes curtain{to{transform:skewX(-2deg) translateX(16px)}}@keyframes dust{to{transform:translate(-20px,24px)}}@keyframes light{to{opacity:.22;transform:translateX(20px)}}@keyframes breathe{50%{transform:translate(640px,267px)}}</style>
</defs>
<rect width="1600" height="900" fill="#d8cfbc"/>
<image href="data:image/svg+xml;base64," x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>

<g class="curtain" opacity=".8"><path d="M1260 0q-80 240-20 480t-28 420h388V0z" fill="#d7d0b9" opacity=".62"/><path d="M1280 0q-40 240 20 480t-16 420" fill="none" stroke="#a89e88" stroke-width="12" opacity=".4"/></g>
<g class="dust" fill="#fff4cd" opacity=".55"><circle cx="990" cy="240" r="4"/><circle cx="1110" cy="330" r="3"/><circle cx="940" cy="510" r="5"/><circle cx="1210" cy="420" r="3"/></g>
<path d="M735 170 L1275 900 H945 L590 180Z" fill="#ffd98c" opacity=".13" class="light"/>
<g transform="translate(640 270)" class="girl"><ellipse cx="168" cy="355" rx="130" ry="35" fill="#2c2824" opacity=".15"/><path d="M92 215q70-45 150 0l45 310H45z" fill="#d9e2df" stroke="#3f3b36" stroke-width="7"/><path d="M135 205l32 42 34-42" fill="#f2eee6" stroke="#74716b" stroke-width="4"/><ellipse cx="168" cy="146" rx="65" ry="76" fill="#d0a080" stroke="#413733" stroke-width="6"/><path d="M104 154q0-96 72-104 75 13 64 112-46-35-136-8" fill="#3d312c"/><path d="M128 145q14-7 29 0M182 145q14-7 29 0" fill="none" stroke="#3a312d" stroke-width="5"/><circle cx="145" cy="155" r="5" fill="#302a28"/><circle cx="198" cy="155" r="5" fill="#302a28"/><path d="M151 190q18 9 38-1" fill="none" stroke="#8d5d57" stroke-width="5" stroke-linecap="round"/></g>
<rect width="1600" height="900" fill="url(#grade)" pointer-events="none"/>
<rect width="1600" height="900" fill="url(#vign)" pointer-events="none"/>
<rect width="1600" height="900" fill="#fff" filter="url(#paper)" opacity=".32" pointer-events="none"/>
</svg>