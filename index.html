<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#1c2425" />
<meta name="color-scheme" content="dark" />
<title>花语</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<div id="app" class="app">
  <section id="titleScreen" class="title-screen active" aria-label="花语开始界面">
    <div class="title-paper">
      <p class="eyebrow">旧高中记忆 · 场景式青春叙事解谜</p>
      <h1>花语</h1>
      <p class="subtitle">有些路，游戏也不能替你重新走。</p>
      <div class="title-actions">
        <button id="startBtn" class="paper-btn primary">开始</button>
        <button id="continueBtn" class="paper-btn">继续</button>
      </div>
      <p class="title-note">建议佩戴耳机。进度会自动保存在本机。</p>
    </div>
  </section>

  <main id="game" class="game" hidden>
    <header class="hud">
      <div class="hud-left">
        <span id="chapterLabel" class="chapter-label">序章</span>
        <span id="sceneLabel" class="scene-label">九年后的高三七班</span>
        <span id="flowerLabel" class="flower-label" aria-hidden="true"></span>
      </div>
      <div class="hud-right">
        <button id="notebookBtn" class="icon-btn" aria-label="植物册">植物册</button>
        <button id="inventoryBtn" class="icon-btn" aria-label="物品栏">物品</button>
        <button id="hintBtn" class="icon-btn" aria-label="提示">花瓣提示</button>
        <button id="settingsBtn" class="icon-btn" aria-label="设置">设置</button>
      </div>
    </header>

    <section id="scene" class="scene" aria-live="polite">
      <img id="sceneArt" class="scene-art" src="assets/art/classroom_old.webp" alt="旧高中教室" draggable="false" />
      <div id="sceneTone" class="scene-tone"></div>
      <div id="hotspotLayer" class="hotspot-layer"></div>
      <div id="memoryVignette" class="memory-vignette" aria-hidden="true"></div>
      <div id="cameraShade" class="camera-shade" aria-hidden="true"></div>
      <div id="sceneFx" class="scene-fx" aria-hidden="true">
        <i class="fx-light"></i><i class="fx-curtain"></i><i class="fx-shadow"></i><i class="fx-dust"></i><i class="fx-rain"></i>
      </div>
      <div id="sceneActors" class="scene-actors" aria-hidden="true"></div>
    </section>

    <section id="focusScene" class="focus-scene" role="dialog" aria-modal="true" aria-live="polite" aria-label="物件特写" hidden>
      <div class="focus-backdrop"></div>
      <div id="focusFrame" class="focus-frame">
        <div id="focusVisual" class="focus-visual" aria-live="off"></div>
        <div class="focus-copy">
          <div id="focusKicker" class="focus-kicker">记忆细节</div>
          <h2 id="focusTitle"></h2>
          <p id="focusCaption"></p>
        </div>
        <div class="focus-actions">
          <button id="focusBack" class="focus-btn ghost">回去</button>
          <button id="focusInspect" class="focus-btn">继续观察</button>
        </div>
      </div>
    </section>

    <section id="cinematicShot" class="cinematic-shot" aria-live="polite" aria-label="电影镜头" hidden>
      <img id="cinematicShotImage" alt="" />
      <div class="cinematic-letterbox cinematic-letterbox-top"></div>
      <div class="cinematic-letterbox cinematic-letterbox-bottom"></div>
      <div id="cinematicShotCaption" class="cinematic-shot-caption"></div>
    </section>

    <section id="montageScene" class="montage-scene" aria-label="青春回忆蒙太奇" hidden>
      <img id="montageImage" class="montage-image" alt="回忆画面" />
      <div class="montage-flash"></div>
      <div id="montageCaption" class="montage-caption"></div>
    </section>

    <section id="dialogue" class="dialogue" aria-live="polite" aria-atomic="true" hidden>
      <div class="speaker" id="speaker"></div>
      <div class="line" id="line"></div>
      <button id="dialogueNext" class="dialogue-next" aria-label="继续">继续</button>
    </section>

    <button id="contextAction" class="context-action" hidden></button>
    <div id="toast" class="toast" role="status"></div>
  </main>

  <div id="objectOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="游戏交互物件" hidden>
    <div class="object-shell">
      <button id="objectClose" class="close-btn" aria-label="关闭">返回场景</button>
      <div id="objectContent" class="object-content"></div>
    </div>
  </div>

  <div id="sidePanel" class="overlay panel-overlay" role="dialog" aria-modal="true" aria-label="信息面板" hidden>
    <div class="side-card">
      <button id="sideClose" class="close-btn" aria-label="关闭信息面板">关闭</button>
      <div id="sideContent"></div>
    </div>
  </div>

  <div id="settingsPanel" class="overlay panel-overlay" role="dialog" aria-modal="true" aria-label="游戏设置" hidden>
    <div class="side-card settings-card">
      <button id="settingsClose" class="close-btn" aria-label="关闭设置">关闭</button>
      <h2>设置</h2>
      <label>音乐 <input id="musicRange" type="range" min="0" max="1" step="0.05"></label>
      <label>环境声 <input id="ambienceRange" type="range" min="0" max="1" step="0.05"></label>
      <label>音效 <input id="sfxRange" type="range" min="0" max="1" step="0.05"></label>
      <label>文字速度 <input id="textRange" type="range" min="0.6" max="1.6" step="0.1"></label>
      <label class="check"><input id="motionCheck" type="checkbox"> 减少动态效果</label>
      <button id="resetBtn" class="danger-btn">清除本机存档</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
